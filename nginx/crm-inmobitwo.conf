# === nginx: crm-inmobitwo — crm.inmobitwo.seventwo.tech (CRM Vite SPA) ===
# Build generado en el VPS: /srv/infra/inmobitwo/crm-inmobitwo/dist (npm ci + npm run build)
# Certificado independiente: /etc/letsencrypt/live/crm.inmobitwo.seventwo.tech/

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name crm.inmobitwo.seventwo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.inmobitwo.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/crm.inmobitwo.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.inmobitwo.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/infra/inmobitwo/crm-inmobitwo/dist;
    index index.html;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: SPA sin inline-scripts propios; permite API + portal e imágenes
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.inmobitwo.seventwo.tech https://inmobitwo.seventwo.tech;" always;

    # Assets con hash de Vite: caché agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback (react-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
