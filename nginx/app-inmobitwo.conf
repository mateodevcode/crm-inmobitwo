# === nginx: app-inmobitwo — app.inmobitwo.seventwo.tech (frontend Vite SPA, futuro CRM) ===
# Build generado en el VPS: /srv/infra/inmobitwo/frontend-inmobitwo/dist (npm ci + npm run build)
# Certificado independiente: /etc/letsencrypt/live/app.inmobitwo.seventwo.tech/

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name app.inmobitwo.seventwo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.inmobitwo.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/app.inmobitwo.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.inmobitwo.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/infra/inmobitwo/frontend-inmobitwo/dist;
    index index.html;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash de Vite: caché agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback (react-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
